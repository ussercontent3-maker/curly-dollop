name: Import Videos

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python importer/import_all.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
